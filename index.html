<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SatTrail">
  <meta name="theme-color" content="#121212">
  <title>SatTrail - LEO Satellite Trail Predictor</title>

  <!-- iOS Web App Icon (Embedded SVG Data URI) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23e53935'><rect width='512' height='512' rx='100' fill='%23121212'/><circle cx='256' cy='256' r='180' stroke='%23333' stroke-width='16' fill='none'/><path d='M100 256 Q 256 100 412 256' stroke='%23ff5252' stroke-width='12' fill='none' stroke-dasharray='16,16'/><circle cx='320' cy='160' r='14' fill='%23ff5252'/><circle cx='256' cy='256' r='8' fill='%23ffffff'/></svg>">

  <!-- Manifest Data URI for PWA -->
  <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;SatTrail Predictor&quot;,&quot;short_name&quot;:&quot;SatTrail&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#121212&quot;,&quot;theme_color&quot;:&quot;#121212&quot;}">

  <!-- Satellite.js library for SGP4 orbital propagation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #e53935;
      --text: #e0e0e0;
      --text-muted: #888888;
      --border: #333333;
      --success: #4caf50;
      --warning: #ff9800;
    }

    /* Red Night Mode Theme */
    body.night-mode {
      --bg: #000000;
      --card-bg: #0d0000;
      --accent: #ff0000;
      --text: #cc0000;
      --text-muted: #660000;
      --border: #440000;
      --success: #aa0000;
      --warning: #ff4400;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px; padding-top: calc(env(safe-area-inset-top) + 16px); padding-bottom: 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 0.5px; }
    .night-toggle { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 1.0rem; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .full-width { grid-column: span 2; }
    
    label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    
    button.btn-main { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    button.btn-sec { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin-top: 4px; }
    
    .event-card { border-left: 4px solid var(--accent); background: var(--bg); padding: 10px; border-radius: 4px; margin-bottom: 8px; font-size: 0.85rem; }
    .event-card.safe { border-left-color: var(--success); }
    .event-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
    .event-sub { color: var(--text-muted); font-size: 0.75rem; }
    
    .timeline-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #222; margin: 12px 0; }
    .timeline-slot { flex: 1; border-right: 1px solid #111; }
    .timeline-slot.clear { background: var(--success); }
    .timeline-slot.conflict { background: var(--accent); }
    
    .status-text { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin: 10px 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>SatTrail Predictor</h1>
    <button class="night-toggle" onclick="toggleNightMode()">Red Mode</button>
  </div>

  <!-- Observer Location -->
  <div class="card">
    <h2>1. Observer Location</h2>
    <div class="grid">
      <div>
        <label>Latitude (°N)</label>
        <input type="number" id="lat" step="0.0001" value="44.9778">
      </div>
      <div>
        <label>Longitude (°E)</label>
        <input type="number" id="lon" step="0.0001" value="-93.2650">
      </div>
      <div class="full-width">
        <button class="btn-sec" onclick="getGPS()">Use Current GPS Location</button>
      </div>
    </div>
  </div>

  <!-- Target & Mode Selection -->
  <div class="card">
    <h2>2. Target & Framing</h2>
    <div class="grid">
      <div class="full-width">
        <label>Photography Mode</label>
        <select id="mode" onchange="onModeChange()">
          <option value="deepsky">Deep Sky (Smart Telescope / Narrow FOV)</option>
          <option value="milkyway">Milky Way (Wide-Field / Camera Lens)</option>
        </select>
      </div>

      <!-- Presets -->
      <div class="full-width" id="preset-container" style="display:none;">
        <label>Milky Way Target Preset</label>
        <select id="preset" onchange="applyPreset()">
          <option value="custom">Custom RA / Dec</option>
          <option value="galactic_center" selected>Galactic Center (Sagittarius) - RA 17.7h, Dec -29°</option>
          <option value="cygnus">Cygnus / Northern Cross - RA 20.6h, Dec +42°</option>
          <option value="orion">Orion Region - RA 5.6h, Dec +0°</option>
          <option value="cassiopeia">Cassiopeia Core - RA 1.0h, Dec +60°</option>
        </select>
      </div>

      <div>
        <label>Target RA (Hours 0-24)</label>
        <input type="number" id="targetRA" step="0.01" value="17.76">
      </div>
      <div>
        <label>Target Dec (Degrees)</label>
        <input type="number" id="targetDec" step="0.01" value="-29.01">
      </div>

      <div class="full-width" id="fov-container">
        <label id="fov-label">FOV Diameter / Window Radius (°)</label>
        <input type="number" id="fovRadius" step="0.1" value="2.0">
      </div>

      <div class="full-width" id="lens-container" style="display:none;">
        <label>Lens Focal Length (Full Frame Equivalent)</label>
        <select id="lens" onchange="applyLens()">
          <option value="14">14mm Ultra-Wide (~104° FOV)</option>
          <option value="20">20mm Wide (~84° FOV)</option>
          <option value="24" selected>24mm Wide (~74° FOV)</option>
          <option value="35">35mm Standard (~54° FOV)</option>
          <option value="50">50mm Nifty Fifty (~40° FOV)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Exposure Setup -->
  <div class="card">
    <h2>3. Session Parameters</h2>
    <div class="grid">
      <div>
        <label>Sub Duration (sec)</label>
        <input type="number" id="subLength" value="10">
      </div>
      <div>
        <label>Session Duration (min)</label>
        <input type="number" id="sessionMins" value="60">
      </div>
      <div class="full-width">
        <label>TLE Satellite Group</label>
        <select id="tleGroup">
          <option value="visual">Brightest / Visual Satellites (~100)</option>
          <option value="starlink">Starlink Constellation</option>
          <option value="active">All Active Satellites (Slower calculation)</option>
          <option value="stations">Space Stations (ISS / Tiangong)</option>
        </select>
      </div>
    </div>
    <button class="btn-main" onclick="runPrediction()">Calculate Satellite Crossing Windows</button>
  </div>

  <!-- Results Section -->
  <div class="card" id="resultsCard" style="display:none;">
    <h2>4. Prediction & Timeline</h2>
    <div class="status-text" id="statusText">Processing...</div>
    
    <label>Sub-Exposure Clearance Timeline</label>
    <div class="timeline-bar" id="timelineBar"></div>

    <div id="crossingEvents"></div>
  </div>

  <script>
    function toggleNightMode() {
      document.body.classList.toggle('night-mode');
    }

    function getGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById('lat').value = pos.coords.latitude.toFixed(4);
          document.getElementById('lon').value = pos.coords.longitude.toFixed(4);
        }, () => alert("Unable to fetch location. Please enter manually."));
      }
    }

    function onModeChange() {
      const mode = document.getElementById('mode').value;
      const isMilkyWay = (mode === 'milkyway');
      document.getElementById('preset-container').style.display = isMilkyWay ? 'block' : 'none';
      document.getElementById('lens-container').style.display = isMilkyWay ? 'block' : 'none';
      
      if (isMilkyWay) {
        applyLens();
      } else {
        document.getElementById('fov-label').innerText = 'Target Window Diameter / Radius (Degrees)';
        document.getElementById('fovRadius').value = '2.0';
      }
    }

    function applyPreset() {
      const preset = document.getElementById('preset').value;
      if (preset === 'galactic_center') {
        document.getElementById('targetRA').value = 17.76;
        document.getElementById('targetDec').value = -29.01;
      } else if (preset === 'cygnus') {
        document.getElementById('targetRA').value = 20.62;
        document.getElementById('targetDec').value = 42.30;
      } else if (preset === 'orion') {
        document.getElementById('targetRA').value = 5.58;
        document.getElementById('targetDec').value = 0.00;
      } else if (preset === 'cassiopeia') {
        document.getElementById('targetRA').value = 1.00;
        document.getElementById('targetDec').value = 60.20;
      }
    }

    function applyLens() {
      const fl = parseFloat(document.getElementById('lens').value);
      // Approximate diagonal FOV formula for 35mm full frame sensor (36mm x 24mm -> 43.27mm diagonal)
      const fovDeg = 2 * Math.atan(43.27 / (2 * fl)) * (180 / Math.PI);
      // Window radius for crossing check is half the total FOV
      document.getElementById('fovRadius').value = (fovDeg / 2).toFixed(1);
      document.getElementById('fov-label').innerText = `Effective Lens FOV Radius: ${(fovDeg / 2).toFixed(1)}° (${fovDeg.toFixed(0)}° total width)`;
    }

    async function runPrediction() {
      const resultsCard = document.getElementById('resultsCard');
      const statusText = document.getElementById('statusText');
      const crossingEvents = document.getElementById('crossingEvents');
      const timelineBar = document.getElementById('timelineBar');

      resultsCard.style.display = 'block';
      statusText.innerText = 'Fetching latest orbital elements (TLEs)...';
      crossingEvents.innerHTML = '';
      timelineBar.innerHTML = '';

      const lat = parseFloat(document.getElementById('lat').value);
      const lon = parseFloat(document.getElementById('lon').value);
      const raDeg = parseFloat(document.getElementById('targetRA').value) * 15.0; // convert hours to degrees
      const decDeg = parseFloat(document.getElementById('targetDec').value);
      const fovRad = parseFloat(document.getElementById('fovRadius').value);
      const subSecs = parseInt(document.getElementById('subLength').value);
      const sessionMins = parseInt(document.getElementById('sessionMins').value);
      const group = document.getElementById('tleGroup').value;

      try {
        const tleUrl = `https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=tle`;
        const resp = await fetch(tleUrl);
        if (!resp.ok) throw new Error("CelesTrak request failed.");
        const text = await resp.text();

        const tles = parseTLE(text);
        statusText.innerText = `Propagating ${tles.length} satellites over ${sessionMins} mins...`;

        const now = new Date();
        const endTime = new Date(now.getTime() + sessionMins * 60000);
        const stepSecs = 3; // 3-second simulation step size

        let crossings = [];
        let subSlots = new Array(Math.floor((sessionMins * 60) / subSecs)).fill(true);

        // Run orbital propagation
        for (let sat of tles) {
          let satrec = satellite.twoline2satrec(sat.line1, sat.line2);
          let inWindow = false;
          let passStart = null;
          let minDist = 999;

          for (let t = new Date(now.getTime()); t <= endTime; t = new Date(t.getTime() + stepSecs * 1000)) {
            let positionAndVelocity = satellite.propagate(satrec, t);
            if (!positionAndVelocity.position) continue;

            let gmst = satellite.gstime(t);
            let satEci = positionAndVelocity.position;
            
            // Convert ECI to Topocentric RA & Dec for Observer
            let observerGd = { latitude: lat * Math.PI / 180, longitude: lon * Math.PI / 180, height: 0.2 };
            let satEcf = satellite.eciToEcf(satEci, gmst);
            let lookAngles = satellite.ecfToLookAngles(observerGd, satEcf);

            // Compute Topocentric RA / Dec
            let satRaDec = eciToRaDec(satEci, gmst, observerGd);
            let sep = angularSeparation(satRaDec.ra, satRaDec.dec, raDeg, decDeg);

            // Check if satellite is above horizon and inside FOV target window
            if (lookAngles.elevation > 0 && sep <= fovRad) {
              if (sep < minDist) minDist = sep;
              if (!inWindow) {
                inWindow = true;
                passStart = new Date(t);
              }
              // Mark corresponding sub-exposure slot as conflicted
              let elapsedSecs = (t.getTime() - now.getTime()) / 1000;
              let slotIdx = Math.floor(elapsedSecs / subSecs);
              if (slotIdx >= 0 && slotIdx < subSlots.length) {
                subSlots[slotIdx] = false;
              }
            } else if (inWindow) {
              inWindow = false;
              crossings.push({
                name: sat.name,
                start: passStart,
                end: new Date(t),
                minSep: minDist
              });
              minDist = 999;
            }
          }
        }

        // Display Timeline Bar
        subSlots.forEach(isClear => {
          let div = document.createElement('div');
          div.className = `timeline-slot ${isClear ? 'clear' : 'conflict'}`;
          timelineBar.appendChild(div);
        });

        // Summary Statistics
        const clearCount = subSlots.filter(x => x).length;
        const totalSubs = subSlots.length;
        statusText.innerText = `Prediction complete: ${crossings.length} satellite passage(s) detected. ${clearCount}/${totalSubs} sub-exposures completely satellite-free.`;

        if (crossings.length === 0) {
          crossingEvents.innerHTML = `<div class="event-card safe"><div class="event-header"><span>Clear Window!</span></div><div class="event-sub">No satellites in the selected TLE catalog will pass through your target window during this imaging session.</div></div>`;
        } else {
          crossings.forEach(c => {
            let startStr = c.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let endStr = c.end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let dur = Math.round((c.end - c.start) / 1000);
            
            let card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
              <div class="event-header">
                <span>${c.name}</span>
                <span>${startStr} - ${endStr}</span>
              </div>
              <div class="event-sub">Transit Duration: ${dur}s | Min Angular Distance to Center: ${c.minSep.toFixed(2)}°</div>
            `;
            crossingEvents.appendChild(card);
          });
        }

      } catch (err) {
        statusText.innerText = `Error: ${err.message}. Check your internet connection or try another TLE group.`;
      }
    }

    // Helper: Parse TLE text into array of satellite objects
    function parseTLE(tleText) {
      const lines = tleText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let result = [];
      for (let i = 0; i < lines.length; i += 3) {
        if (lines[i+1] && lines[i+2] && lines[i+1].startsWith('1 ') && lines[i+2].startsWith('2 ')) {
          result.push({
            name: lines[i].replace(/^0\s+/, ''),
            line1: lines[i+1],
            line2: lines[i+2]
          });
        }
      }
      return result;
    }

    // Helper: Topocentric RA & Dec calculation taking observer position & Earth rotation into account
    function eciToRaDec(satEci, gmst, obsGd) {
      let obsEcf = satellite.geodeticToEcf(obsGd);
      let obsEci = satellite.ecfToEci(obsEcf, gmst);
      
      // Topocentric vector from observer to satellite
      let rx = satEci.x - obsEci.x;
      let ry = satEci.y - obsEci.y;
      let rz = satEci.z - obsEci.z;

      let range = Math.sqrt(rx*rx + ry*ry + rz*rz);
      let dec = Math.asin(rz / range) * (180 / Math.PI);
      let ra = Math.atan2(ry, rx) * (180 / Math.PI);
      if (ra < 0) ra += 360;

      return { ra: ra, dec: dec };
    }

    // Helper: Haversine angular distance formula (in degrees)
    function angularSeparation(ra1, dec1, ra2, dec2) {
      let r1 = ra1 * Math.PI / 180;
      let d1 = dec1 * Math.PI / 180;
      let r2 = ra2 * Math.PI / 180;
      let d2 = dec2 * Math.PI / 180;

      let ddec = d2 - d1;
      let dra = r2 - r1;

      let a = Math.sin(ddec / 2) ** 2 + Math.cos(d1) * Math.cos(d2) * Math.sin(dra / 2) ** 2;
      return 2 * Math.asin(Math.min(1, Math.sqrt(a))) * (180 / Math.PI);
    }
  </script>

  <!-- Offline Service Worker Registration via Blob URL -->
  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'sattrail-v1';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
